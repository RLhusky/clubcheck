<style>
  :root {
    --maroon: #861F2C; --maroon-dark: #5E1520; --maroon-soft: #F5E8E9;
    --ink: #17161B; --body: #3F3D45; --muted: #6A6870; --faint: #8E8B93;
    --ground: #F6F5F3; --card: #FFFFFF; --line: #ECE9E5; --line-strong: #E3E0DC;
    --green: #0F7A4A; --green-soft: #E4F3EB; --amber: #7A4F00; --amber-soft: #FBF0D9;
    --shadow: 0 1px 2px rgba(23,22,27,.04), 0 8px 24px rgba(23,22,27,.05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --maroon: #E06B79; --maroon-dark: #F29AA4; --maroon-soft: #3A1E23;
      --ink: #F4F2F0; --body: #D6D3D0; --muted: #A29FA6; --faint: #7F7C84;
      --ground: #121114; --card: #1C1B1F; --line: #2A282E; --line-strong: #34323A;
      --green: #5CC596; --green-soft: #15291F; --amber: #E9B65A; --amber-soft: #2E2413;
      --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.5 Geist, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1, h2, h3, .display { font-family: "Bricolage Grotesque", Geist, system-ui, sans-serif; letter-spacing: -.02em; margin: 0; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  .hidden { display: none !important; }

  /* Header */
  header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 20px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .brand small { display: block; font: 500 11px/1 Geist, sans-serif; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  nav.tabs { display: flex; gap: 4px; margin-left: auto; }
  nav.tabs a { text-decoration: none; padding: 8px 12px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 15px; white-space: nowrap; }
  nav.tabs a.on { color: var(--ink); background: var(--card); box-shadow: var(--shadow); }
  nav.tabs .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: var(--maroon); color: #fff; font-size: 12px; line-height: 20px; text-align: center; }
  @media (max-width: 720px) {
    /* A backdrop filter would pin the fixed tab bar to the header instead of the screen. */
    header { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--ground); }
    .bar { height: 56px; }
    nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; justify-content: space-around; background: var(--card); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); margin: 0; z-index: 10; }
    nav.tabs a { font-size: 13px; padding: 8px 10px; }
    nav.tabs a.on { box-shadow: none; background: var(--maroon-soft); color: var(--maroon); }
      main { padding-bottom: 84px; }
  }

  .eyebrow { color: var(--maroon); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }

  .intro { padding: 30px 0 0; }
  .intro h1 { font-size: 30px; font-weight: 700; }
  .intro p { color: var(--muted); margin: 4px 0 0; }
  .hint { color: var(--faint); font-size: 13px; }
  .deadlines { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 6px 8px 10px; }
  .deadlines .group { margin: 12px 10px 4px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .deadlines .group span { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--faint); margin-left: 4px; }
  .dl { display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 12px; text-decoration: none; }
  .dl:hover { background: var(--ground); }
  .dl .when { flex: none; width: 92px; }
  .dl .when b { display: block; font-size: 15px; }
  .dl .when span { display: block; font-size: 13px; color: var(--maroon); font-weight: 600; }
  .dl .logo { width: 40px; height: 40px; border-radius: 10px; }
  .dl .logo.mono { font-size: 15px; }
  .dl .what { flex: 1; min-width: 0; }
  .dl h3 { font-size: 15px; font-weight: 600; font-family: Geist, system-ui, sans-serif; letter-spacing: 0; }
  .dl p { margin: 1px 0 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl .go { flex: none; font-size: 14px; font-weight: 600; color: var(--maroon); }
  .dl.rolling .when span { color: var(--green); }
  .dl.closed .when span { color: var(--faint); font-weight: 500; }
  .dl.closed .when b, .dl.closed h3 { color: var(--muted); }
  .dl.closed .logo { opacity: .7; }
  @media (max-width: 720px) { .dl { gap: 10px; padding: 10px 6px; } .dl .when { width: 64px; } .dl .when b { font-size: 14px; } .dl .when span { font-size: 12px; } .dl .go { display: none; } }

  /* Sections */
  section.block { margin: 36px 0; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
  .head h2 { font-size: 26px; font-weight: 700; }
  .head a, .linkish { color: var(--maroon); font-weight: 600; font-size: 15px; text-decoration: none; background: none; border: 0; padding: 0; }
  .sub { color: var(--muted); margin: -8px 0 16px; font-size: 15px; }

  /* Search and filters */
  .search { position: relative; margin: 26px 0 14px; }
  .search input { width: 100%; font: inherit; font-size: 17px; padding: 15px 16px 15px 46px; border-radius: 16px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); outline: none; box-shadow: var(--shadow); }
  .search input:focus { border-color: var(--maroon); }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line-strong); background: var(--card); padding: 7px 13px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--body); }
  .chip.on { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .chip.flag.on { background: var(--maroon); border-color: var(--maroon); color: #fff; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 14px; color: var(--muted); font-size: 14px; }
  .toolbar select { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line-strong); border-radius: 10px; padding: 6px 10px; }

  /* Club cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; gap: 10px; } }
  .card { position: relative; display: flex; gap: 14px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; text-decoration: none; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
  .card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
  .logo { flex: none; width: 56px; height: 56px; border-radius: 14px; background: #fff; border: 1px solid var(--line); object-fit: contain; display: grid; place-items: center; overflow: hidden; }
  .logo.mono { font: 800 20px/1 "Bricolage Grotesque", sans-serif; color: var(--maroon); background: var(--maroon-soft); border-color: transparent; letter-spacing: -.03em; }
  .card .body { min-width: 0; flex: 1; }
  .card h3 { font-size: 17px; font-weight: 700; line-height: 1.25; padding-right: 30px; }
  .card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--ground); color: var(--muted); }
  .tag.sel { background: var(--maroon-soft); color: var(--maroon); }
  .tag.due { background: var(--amber-soft); color: var(--amber); }
  .tag.live { background: var(--green-soft); color: var(--green); }
  .save { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 17px; border: 0; background: transparent; display: grid; place-items: center; color: var(--faint); }
  .save:hover { background: var(--ground); }
  .save.on { color: var(--maroon); }
  .more { display: block; margin: 18px auto 0; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--card); font-weight: 600; }

  /* Deadlines strip */
  .rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 8px; }
  .rail::-webkit-scrollbar { display: none; }
  .due-card { display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; text-decoration: none; box-shadow: var(--shadow); }
  .due-card .top { display: flex; gap: 12px; align-items: center; }
  .due-card .logo { width: 44px; height: 44px; border-radius: 12px; }
  .due-card h3 { font-size: 16px; font-weight: 700; line-height: 1.25; }
  .due-card.best { position: relative; min-height: 196px; }
  .due-card.best h3 { padding-right: 28px; }
  .due-card.best p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .countdown { font: 700 22px/1 "Bricolage Grotesque", sans-serif; color: var(--maroon); letter-spacing: -.02em; }
  .countdown small { display: block; font: 500 13px/1.3 Geist, sans-serif; color: var(--muted); letter-spacing: 0; margin-top: 4px; }

  /* Calendar */
  .week { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); }
  .week button.arrow { flex: none; width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--ground); }
  .days { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { border: 0; background: var(--ground); border-radius: 12px; padding: 8px 0; text-align: center; position: relative; }
  .day span { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  .day b { display: block; font: 700 19px/1.2 "Bricolage Grotesque", sans-serif; }
  .day.on { background: var(--maroon); color: #fff; }
  .day.on span { color: rgba(255,255,255,.8); }
  .day.has::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 3px; background: var(--maroon); }
  .day.on.has::after { background: #fff; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin: 0 0 14px; }
  .seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--ink); color: var(--ground); }
  .events { display: grid; gap: 10px; margin-top: 16px; }
  .event { display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; text-decoration: none; }
  .event .time { flex: none; width: 64px; font-weight: 600; font-size: 14px; }
  .event .time small { display: block; color: var(--faint); font-weight: 500; }
  .event .logo { width: 40px; height: 40px; border-radius: 10px; }
  .event h3 { font-size: 16px; font-weight: 700; }
  .event p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  /* Empty states */
  .empty { text-align: center; padding: 34px 20px; background: var(--card); border: 1px dashed var(--line-strong); border-radius: 18px; color: var(--muted); }
  .empty h3 { color: var(--ink); font-size: 18px; margin-bottom: 4px; }
  .empty p { margin: 0 auto; max-width: 440px; font-size: 15px; }

  /* Club page */
  .back { display: inline-flex; align-items: center; gap: 6px; margin: 22px 0 0; color: var(--muted); text-decoration: none; font-weight: 500; }
  .club-top { display: flex; gap: 20px; align-items: center; margin: 18px 0 22px; }
  .club-top .logo { width: 96px; height: 96px; border-radius: 24px; }
  .club-top .logo.mono { font-size: 34px; }
  .club-top h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.05; font-weight: 800; }
  .club-top .meta { color: var(--muted); margin-top: 6px; }
  .club-top .tags { margin-top: 8px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 24px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--card); font-weight: 600; text-decoration: none; font-size: 15px; }
  .btn.primary { background: var(--maroon); border-color: var(--maroon); color: #fff; }
  .btn.saved { background: var(--maroon-soft); border-color: transparent; color: var(--maroon); }
  .cols { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } .club-top .logo { width: 76px; height: 76px; border-radius: 20px; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .panel h2 { font-size: 19px; font-weight: 700; margin-bottom: 10px; }
  .prose { color: var(--body); white-space: pre-line; overflow-wrap: anywhere; }
  .prose.clamped { max-height: 220px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .apply-box { border-color: var(--maroon); }
  .apply-box .countdown { font-size: 30px; }
  .meeting { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .meeting:first-of-type { border-top: 0; padding-top: 0; }
  .date { flex: none; width: 50px; text-align: center; background: var(--maroon-soft); color: var(--maroon); border-radius: 12px; padding: 6px 0; }
  .date span { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .date b { display: block; font: 700 20px/1.1 "Bricolage Grotesque", sans-serif; }
  .meeting h3 { font-size: 16px; font-weight: 700; }
  .meeting p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .meeting .linkish { font-size: 14px; }
  .claim { background: var(--ground); border: 1px solid var(--line); }
  .claim p { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 5px; color: var(--body); }
  input.field, select.field { width: 100%; font: inherit; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); margin: 0 0 12px; outline: none; }
  input.field:focus { border-color: var(--maroon); }
  .err { color: var(--maroon); font-size: 14px; min-height: 20px; margin: -4px 0 8px; }

  /* Tracker */
  .track { display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; }
  .track .body { flex: 1; min-width: 0; }
  .track h3 { font-size: 16px; font-weight: 700; }
  .track a { text-decoration: none; }
  .track p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .track select { font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--ground); color: var(--ink); padding: 7px 8px; }
  .track .x { border: 0; background: none; color: var(--faint); width: 30px; height: 30px; border-radius: 15px; }
  .track .x:hover { background: var(--ground); }
  .progress { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 18px; }

  /* Footer */
  footer { color: var(--muted); font-size: 14px; padding: 8px 0 40px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  footer a { color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: 12px; font-weight: 500; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .skeleton { height: 92px; border-radius: 18px; background: linear-gradient(90deg, var(--card), var(--line), var(--card)); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>

// Dates
var DAY = 864e5;
function startOfDay(d) { d = new Date(d); d.setHours(0, 0, 0, 0); return d; }

function fmtDate(d) { return new Date(d).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }); }
function untilText(d) {
  var days = Math.ceil((startOfDay(d) - startOfDay(new Date())) / DAY);
  if (days < 0) return "Closed";
  if (days === 0) return "Due today";
  if (days === 1) return "Due tomorrow";
  return days + " days left";
}

// Open now (soonest first), then rolling applications, then ones that closed in the last month.

    .sort(function (a, b) { return new Date(a.apply_deadline) - new Date(b.apply_deadline); });
  var rolling = clubs.filter(function (c) { return !c.apply_deadline && c.apply_url && c.selective; });

    .sort(function (a, b) { return new Date(b.apply_deadline) - new Date(a.apply_deadline); });

    '<button class="chip flag' + (filters.selective ? " on" : "") + '" data-flag="selective">Selective</button>' +

// This week
var weekState = { start: startOfDay(new Date()), day: startOfDay(new Date()), mine: false };

}
function drawEvents(list) {
  var day = list.filter(function (m) { return startOfDay(m.starts_at).getTime() === weekState.day.getTime(); });
  var label = weekState.day.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  if (!day.length) {
    $("events").innerHTML = '<div class="empty"><h3>Nothing on ' + esc(label) + "</h3><p>" +
      (list.length ? "Pick a day with a dot." : "Clubs post meetings here when they use ClubCheck. Run a club? Claim its page to add yours.") + "</p></div>";
    return;
  }
  $("events").innerHTML = day.map(function (m) {
    return '<a class="event" href="#/club/' + esc(m.club.slug) + '"><div class="time">' + esc(fmtTime(m.starts_at)) + "<small>" + esc(fmtTime(m.ends_at)) + "</small></div>" +
      logo(m.club) + "<div><h3>" + esc(m.title) + "</h3><p>" + esc(m.club.name) + (m.location ? " · " + esc(m.location) : "") + "</p></div></a>";
  }).join("");
}

// My clubs: saved clubs and where each application stands.
function viewMine() {
  var v = $("view");
  v.innerHTML = '<div class="intro"><h1>My clubs</h1><p>Clubs you saved, and where each application stands.</p></div><section class="block" id="mine">' + loading() + "</section>";
  ready.then(function () {
    var list = Object.keys(saved).map(function (s) { return bySlug[s]; }).filter(Boolean);
    if (!list.length) {
      $("mine").innerHTML = '<div class="empty"><h3>No saved clubs yet</h3><p>Tap the heart on a club to save it. Track its application here, from interested to accepted.</p><a class="btn primary" style="margin-top:16px" href="#/">Explore clubs</a></div>';
      return;
    }
    list.sort(function (a, b) { return (open(a) ? new Date(a.apply_deadline) : 9e15) - (open(b) ? new Date(b.apply_deadline) : 9e15) || a.name.localeCompare(b.name); });
    var counts = {};
    list.forEach(function (c) { var s = saved[c.slug].status; counts[s] = (counts[s] || 0) + 1; });
    $("mine").innerHTML = '<div class="progress">' + STATUSES.filter(function (s) { return counts[s[0]]; }).map(function (s) {
      return '<span class="tag' + (s[0] === "in" ? " live" : s[0] === "no" ? "" : " sel") + '">' + counts[s[0]] + " " + s[1].toLowerCase() + "</span>";
    }).join("") + "</div>" + list.map(function (c) {
      var st = saved[c.slug].status;
      return '<div class="track"><a href="#/club/' + esc(c.slug) + '">' + logo(c) + '</a><div class="body"><a href="#/club/' + esc(c.slug) + '"><h3>' + esc(c.name) + "</h3></a><p>" +
        (open(c) ? esc(untilText(c.apply_deadline)) + " · due " + esc(fmtDate(c.apply_deadline)) : c.next_meeting ? "Next meeting " + esc(fmtDate(c.next_meeting)) : esc(CATS[c.category] || "Club")) + "</p></div>" +
        '<select data-status="' + esc(c.slug) + '" aria-label="Status">' + STATUSES.map(function (s) { return '<option value="' + s[0] + '"' + (s[0] === st ? " selected" : "") + ">" + s[1] + "</option>"; }).join("") + "</select>" +
        '<button class="x" data-save="' + esc(c.slug) + '" aria-label="Remove">✕</button></div>';
    }).join("") + '<p class="sub" style="margin-top:16px">Saved on this browser only. Sign-in to keep them across devices is coming soon.</p>';
    $("mine").onchange = function (e) {
      var s = e.target.getAttribute("data-status"); if (!s) return;
      saved[s].status = e.target.value; store("cc_saved", saved); viewMine();
    };
  }, function () { $("mine").innerHTML = failed(); });
}

// Routing
function route() {
  var h = location.hash.replace(/^#\/?/, "");
  if (h.indexOf("club/") === 0) return { name: "club", slug: decodeURIComponent(h.slice(5)) };
  if (h === "week") return { name: "week" };
  if (h === "mine") return { name: "mine" };
  return { name: "explore" };
}
function render() {
  var r = route();
  document.title = "ClubCheck · Every UChicago club";
  document.querySelectorAll("#tabs a").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-tab") === (r.name === "club" ? "explore" : r.name)); });
  if (r.name === "club") viewClub(r.slug);
  else if (r.name === "week") viewWeek();
  else if (r.name === "mine") viewMine();
  else viewExplore();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
